name: Refresh sector and FII/DII data

# Runs on weekdays after the NSE close (17:49, 21:19 and 22:49 IST) to refresh sector data and FII/DII history.
# On NSE holidays, or when the dataset has no new trading day yet, the script exits
# without changes and nothing is committed. Free on public repos (standard runners).
on:
  schedule:
    - cron: '19 12 * * 1-5'
    - cron: '49 15 * * 1-5'
    - cron: '19 17 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-sectors
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install duckdb pandas numpy xlrd
      - name: Build sector data
        run: python3 scripts/build-sector-data.py
      - name: Build FII/DII data
        run: python3 scripts/build-fii-dii.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- public/data; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "Refresh sector and FII/DII data"
          git push
