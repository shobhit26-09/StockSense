name: Refresh sector data

# Runs on weekdays after the NSE close (17:30 and 20:30 IST) to catch the day's bhavcopy.
# On NSE holidays, or when the dataset has no new trading day yet, the script exits
# without changes and nothing is committed. Free on public repos (standard runners).
on:
  schedule:
    - cron: '0 12 * * 1-5'
    - cron: '0 15 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-sectors
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install duckdb pandas numpy
      - name: Build sector data
        run: python3 scripts/build-sector-data.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- public/data/sectors.json; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/sectors.json
          git commit -m "Refresh sector data"
          git push
