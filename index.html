<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Primary SEO -->
    <title>
      StockSense — Indian Stock Market Analysis & Stock Screener
    </title>

    <meta
      name="description"
      content="StockSense is an Indian stock market analysis platform for NSE and BSE stocks. Analyze stocks, screen the market, explore technical indicators, sectors, market movers and AI-powered insights."
    />

    <meta name="author" content="StockSense" />

    <link
      rel="canonical"
      href="https://stocksensee.netlify.app/"
    />

    <!-- Google Search Console -->
    <meta
      name="google-site-verification"
      content="E5IDp5pjiZU7VLxjxN5cJUzWUO0b3as5d6DHp-JoY_8"
    />

    <!-- Open Graph -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="StockSense"
    />

    <meta
      property="og:title"
      content="StockSense — Indian Stock Market Analysis & Stock Screener"
    />

    <meta
      property="og:description"
      content="Analyze Indian stocks, screen NSE and BSE markets, explore technical indicators, sectors, market movers and AI-powered insights."
    />

    <meta
      property="og:url"
      content="https://stocksensee.netlify.app/"
    />

    <meta
      property="og:image"
      content="https://stocksensee.netlify.app/og-stocksense.jpg"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="StockSense — Indian Stock Market Analysis"
    />

    <meta
      name="twitter:description"
      content="Indian stock market analysis, stock screening, technical indicators, market trends and AI-powered insights."
    />

    <meta
      name="twitter:image"
      content="https://stocksensee.netlify.app/og-stocksense.jpg"
    />

    <!-- WebApplication structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "StockSense",
        "url": "https://stocksensee.netlify.app/",
        "description": "Indian stock market analysis and stock screening platform for NSE and BSE stocks.",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Web",
        "browserRequirements": "Requires JavaScript"
      }
    </script>

    <!-- WebSite structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "StockSense",
        "url": "https://stocksensee.netlify.app/",
        "description": "Indian stock market analysis and stock screening platform."
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
